name: goal-loop
version: 0.1.0
description: "Goal loop for Hermes: set goals with checks, work to the end via a generic pre_stop hook, verify each goal with a fresh-context judge, keep done goals done, and list owner decisions as text. Needs the companion fork patch for the pre_stop stop-gate hook."
author: Strob0t
kind: backend
requires_hermes: ">=0.23.2"
provides_tools:
  - goal_set
  - goal_go
  - goal_status
  - goal_claim
  - goal_decision
  - goal_block
provides_hooks:
  - pre_stop
  - transform_llm_output
