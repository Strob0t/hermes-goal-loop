name: goal-loop
version: 0.4.4
description: "Goal loop for Hermes: set goals with content checks in the owner's language, go only after an owner message, work to the end via a generic pre_stop hook with budget, idle, stall and restart limits, wait barriers (background work, delegation, builtin /goal, owner), verify each goal with a read-only fresh-context judge on its own model task, keep done goals done, and show the goal list quietly in the owner's language. Needs the companion fork patch for the pre_stop stop-gate hook."
author: Strob0t
kind: backend
requires_hermes: ">=0.23.2"
provides_tools:
  - goal_set
  - goal_go
  - goal_status
  - goal_claim
  - goal_progress
  - goal_decision
  - goal_block
provides_hooks:
  - pre_stop
  - transform_llm_output
  - pre_llm_call
  - pre_api_request
  - post_tool_call
  - pre_tool_call
